services:
  panel-server:
    build: .
    container_name: panel-server
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data          # panels.db + ui/panel.html for preview
    # Config lives in .env, which is gitignored — this file is tracked, so a
    # token pasted here would be committed. Copy .env.example to .env.
    # HA_TOKEN is only for entity dropdowns and the live preview; panels hold
    # their own tokens and this one never reaches a browser.
    env_file: .env
