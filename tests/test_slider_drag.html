<!doctype html>
<title>slider drag test</title>
<style>
  body{font:14px system-ui;background:#111;color:#eee;padding:20px}
  .slider{position:relative;width:400px;height:40px;background:#222;border-radius:8px;margin:20px 0}
  .track{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
  .fill{position:absolute;inset:0;transform-origin:left center;background:#5DCAA5}
  .knob{position:absolute;top:50%;left:0;width:20px;height:20px;border-radius:50%;background:#fff}
  pre{background:#000;padding:12px;border-radius:6px;line-height:1.6}
  .pass{color:#5DCAA5} .fail{color:#E06C5A}
</style>
<div class="slider" id="s"><div class="fill"></div></div>
<pre id="out">running…</pre>
<script>
// The real slider() lifted out of panel.html, so this tests the shipped source
// rather than a copy of it that can drift.
let bumps = 0;
function bump(){ bumps++; }

const out = [];
let pass = 0, fail = 0;
function check(label, got, want){
  const ok = got === want;
  ok ? pass++ : fail++;
  out.push(`<span class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</span>  ${label}` +
           (ok ? '' : `\n         got ${got}, want ${want}`));
}

function shown(el){ return parseInt(el.querySelector('.fill').dataset.to); }

function down(el, pct){
  const r = el.getBoundingClientRect();
  el.dispatchEvent(new MouseEvent('mousedown',
    {bubbles:true, cancelable:true, clientX: r.left + r.width*pct/100, clientY: r.top+5}));
}
function move(el, pct){
  const r = el.getBoundingClientRect();
  window.dispatchEvent(new MouseEvent('mousemove',
    {bubbles:true, clientX: r.left + r.width*pct/100, clientY: r.top+5}));
}
function up(el, pct){
  const r = el.getBoundingClientRect();
  window.dispatchEvent(new MouseEvent('mouseup',
    {bubbles:true, clientX: r.left + r.width*pct/100, clientY: r.top+5}));
}

(async () => {
  const html = await (await fetch('panel.html')).text();
  const start = html.indexOf('function slider(el,get,set){');
  if (start < 0) { document.getElementById('out').textContent = 'slider() not found'; return; }
  // brace-match to the end of the function
  let i = html.indexOf('{', start), depth = 0, end = -1;
  for (; i < html.length; i++) {
    if (html[i] === '{') depth++;
    else if (html[i] === '}') { depth--; if (!depth) { end = i+1; break; } }
  }
  const src = html.slice(start, end);
  const slider = eval('(' + src.replace(/^function slider/, 'function') + ')');

  const el = document.getElementById('s');
  let committed = [];
  const S = slider(el, () => 30, v => committed.push(v));

  check('initial paint from get()', shown(el), 30);

  // --- the drag race ---
  down(el, 50); move(el, 70);
  check('drag paints under the finger', shown(el), 70);
  S.paint(30);                        // an HA state event mid-drag, stale value
  check('external paint ignored mid-drag', shown(el), 70);
  S.paint(12);
  check('a second one ignored too', shown(el), 70);
  move(el, 85);
  check('drag keeps working after them', shown(el), 85);

  // --- release, and the settle window ---
  up(el, 85);
  check('release commits the dragged value', committed[committed.length-1], 85);
  S.paint(30);                        // stale echo arriving after release
  check('stale echo after release ignored', shown(el), 85);
  S.paint(84);                        // within tolerance -> that is confirmation
  check('near-enough confirmation accepted', shown(el), 84);
  S.paint(20);                        // hold released, so this lands
  check('external paints resume once confirmed', shown(el), 20);

  // --- the hold must expire even if nothing ever confirms ---
  down(el, 60); up(el, 60);
  S.paint(5);
  check('held while settling', shown(el), 60);
  await new Promise(r => setTimeout(r, 1650));
  S.paint(5);
  check('hold expires after the window', shown(el), 5);

  // --- a deliberate local action beats an active hold ---
  down(el, 40); up(el, 40);
  S.paint(90);
  check('still holding', shown(el), 40);
  S.force(100);                       // a preset tile
  check('force() lands inside a hold', shown(el), 100);
  S.paint(40);
  check('force() then owns the window', shown(el), 100);

  document.getElementById('out').innerHTML =
    out.join('\n') + `\n\n${pass}/${pass+fail} passed`;
})();
</script>
