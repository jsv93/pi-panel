<!doctype html>
<title>slider drag test</title>
<style>
  body{font:14px system-ui;background:#111;color:#eee;padding:20px}
  .slider{position:relative;width:400px;height:40px;background:#222;border-radius:8px;margin:20px 0}
  .track{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
  .fill{position:absolute;inset:0;transform-origin:left center;background:#5DCAA5}
  .knob{position:absolute;top:50%;left:0;width:20px;height:20px;border-radius:50%;background:#fff}
  pre{background:#000;padding:12px;border-radius:6px;line-height:1.6}
  .pass{color:#5DCAA5} .fail{color:#E06C5A}
</style>
<div class="slider" id="s"><div class="fill"></div></div>
<pre id="out">running…</pre>
<script>
// Lifts the real slider() out of panel.html at run time, so this tests the
// shipped source rather than a copy of it that can drift.
let bumps = 0;
function bump(){ bumps++; }

const out = [];
let pass = 0, fail = 0;
function check(label, got, want){
  const ok = got === want;
  ok ? pass++ : fail++;
  out.push(`<span class="${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</span>  ${label}` +
           (ok ? '' : `\n         got ${got}, want ${want}`));
}

function shown(el){ return parseInt(el.querySelector('.fill').dataset.to); }

function at(el, pct){
  const r = el.getBoundingClientRect();
  return {clientX: r.left + r.width*pct/100, clientY: r.top + r.height/2};
}
function mdown(el, pct){ el.dispatchEvent(new MouseEvent('mousedown', {bubbles:true, cancelable:true, ...at(el,pct)})); }
function mmove(el, pct){ window.dispatchEvent(new MouseEvent('mousemove', {bubbles:true, ...at(el,pct)})); }
function mup(el, pct){ window.dispatchEvent(new MouseEvent('mouseup', {bubbles:true, ...at(el,pct)})); }

function touch(el, type, pct){
  const p = at(el, pct);
  const t = new Touch({identifier:1, target:el, clientX:p.clientX, clientY:p.clientY});
  const empty = (type === 'touchend' || type === 'touchcancel');
  const ev = new TouchEvent(type, {bubbles:true, cancelable:true,
    touches: empty?[]:[t], targetTouches: empty?[]:[t], changedTouches:[t]});
  (type === 'touchstart' ? el : window).dispatchEvent(ev);
}

(async () => {
  const html = await (await fetch('panel.html')).text();
  const start = html.indexOf('function slider(el,get,set){');
  if (start < 0) { document.getElementById('out').textContent = 'slider() not found in panel.html'; return; }
  let i = html.indexOf('{', start), depth = 0, end = -1;
  for (; i < html.length; i++) {
    if (html[i] === '{') depth++;
    else if (html[i] === '}') { depth--; if (!depth) { end = i+1; break; } }
  }
  const slider = eval('(' + html.slice(start, end).replace(/^function slider/, 'function') + ')');

  const el = document.getElementById('s');
  let committed = [];
  const S = slider(el, () => 30, v => committed.push(v));

  check('initial paint from get()', shown(el), 30);

  // --- the bug: external state must not move a bar under a finger ---
  mdown(el, 50); mmove(el, 70);
  check('drag paints under the finger', shown(el), 70);
  S.paint(30);                        // an HA state event mid-drag, stale value
  check('external paint ignored mid-drag', shown(el), 70);
  S.paint(12);
  check('and the next one', shown(el), 70);
  mmove(el, 85);
  check('drag keeps working after them', shown(el), 85);

  // --- a long hold must not drift or snap, however long it lasts ---
  const held = [];
  for (let n = 0; n < 6; n++) {
    await new Promise(r => setTimeout(r, 400));
    S.paint(10);                      // state arriving throughout the hold
    held.push(shown(el));
  }
  check('2.4s hold, state arriving throughout, never moves',
        held.every(v => v === 85), true);

  // --- release, and afterwards state is simply believed again ---
  mup(el, 85);
  check('release commits where the finger was', committed[committed.length-1], 85);
  S.paint(30);
  check('external state lands immediately after release', shown(el), 30);
  S.paint(64);
  check('and keeps landing, with no delayed jump', shown(el), 64);

  // --- a cancelled touch must not leave it deaf forever ---
  touch(el, 'touchstart', 20);
  touch(el, 'touchmove', 45);
  check('touch drag paints', shown(el), 45);
  touch(el, 'touchcancel', 45);
  S.paint(77);
  check('touchcancel releases the drag', shown(el), 77);

  // --- and an ordinary touch drag still commits ---
  touch(el, 'touchstart', 10);
  touch(el, 'touchmove', 55);
  touch(el, 'touchend', 55);
  check('touchend commits the last painted value',
        committed[committed.length-1], 55);

  document.getElementById('out').innerHTML =
    out.join('\n') + `\n\n${pass}/${pass+fail} passed`;
})();
</script>
