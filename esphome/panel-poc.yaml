      - [0xBD, 0x01]
      - [0xB1, 0x00]
      - [0xBD, 0x00]
      - [0xBF, 0x40, 0x81, 0x50, 0x00, 0x1A, 0xFC, 0x01]
      - [0x11]
      - delay 200ms
      - [0xB2, 0x00, 0x80, 0x64, 0x0C, 0x06, 0x2F, 0x00, 0x00, 0x00, 0x00, 0xC0, 0x18]

touchscreen:
  - platform: gt911
    id: panel_touch
    display: panel_display

button:
  - platform: restart
    id: restart_btn
    name: "Restart"

lvgl:
  displays: [panel_display]
  touchscreens: [panel_touch]
  # Full-screen draw buffer in PSRAM: page transitions composite the whole
  # 720x1280 frame, and a partial buffer means flushing it in several passes.
  buffer_size: 100%
  on_idle:
    timeout: 45s
    then:
      - script.execute: update_clock
      - script.execute: refresh_media
      - lvgl.widget.hide: navbar
      - lvgl.page.show: {id: idle_page, animation: NONE}
      - light.turn_on: {id: backlight, brightness: 25%}
  # Tokens below track panel-ui/panel.html so the two panels can be compared
  # side by side. One thing does not transfer: the Pi's surfaces are
  # backdrop-filter glass, and LVGL has no backdrop blur. Translucency and the
  # border hairline are matched; the blur is simply absent, so tiles read
  # flatter here than on the Pi no matter what these values say.
  style_definitions:
    - id: page_bg
      # Flat, not the Pi's top-to-bottom gradient. A 720x1280 gradient is
      # redrawn under every frame of a page transition and was measurably
      # choppy; this sits between --bg-top and --bg-bot.
      bg_color: 0x101018
      pad_all: 0
    - id: tile
      bg_color: 0x1E1E28
      bg_opa: 42%                 # --tile      rgba(30,30,40,.42)
      border_width: 1
      border_color: 0x787D96      # --tile-line rgba(120,125,150,.22)
      border_opa: 22%
      radius: 24                  # --r
      shadow_width: 0
    - id: nav_label
      text_font: montserrat_18
      text_color: 0x3D3D46        # --ink-ghost
  top_layer:
    widgets:
      - obj:
          id: navbar
          align: bottom_mid
          width: 720
          height: 132                 # --nav
          # Opaque on purpose. The Pi's nav is translucent so its backdrop
          # blur has something to blur; with no blur here that translucency
          # only bought a full-width alpha blend on every animated frame.
          bg_color: 0x09090E
          bg_opa: COVER
          border_width: 1             # 1px top hairline, matches .nav
          border_color: 0x787D96
          border_opa: 14%
          border_side: TOP
          radius: 0
          pad_all: 0
          layout:
            type: flex
            flex_flow: ROW
            flex_align_main: space_evenly
            flex_align_cross: center
          widgets:
            - button:
                width: 180
                height: 124
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                widgets:
                  - label: {id: nav_lights_icon, align: center, y: -14, text_font: mdi_36, text_color: 0x3D3D46, text: "\U000F0335"}
                  - label: {align: center, y: 22, styles: nav_label, text: "Lights"}
                on_click:
                  - lvgl.page.show: {id: lights_page, animation: OVER_TOP, time: 140ms}
            - button:
                width: 180
                height: 124
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                widgets:
                  # The Pi shows the live temperature here rather than an icon.
                  # Stays "--°" until a temperature sensor is wired up; see the
                  # commented block in `sensor:`.
                  - label: {id: nav_climate_icon, align: center, y: -12, text_font: montserrat_28, text_color: 0x3D3D46, text: "--°"}
                  - label: {align: center, y: 22, styles: nav_label, text: "Climate"}
                on_click:
                  - lvgl.page.show: {id: climate_page, animation: OVER_TOP, time: 140ms}
            - button:
                width: 180
                height: 124
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                widgets:
                  - label: {id: nav_blinds_icon, align: center, y: -14, text_font: mdi_36, text_color: 0x3D3D46, text: "\U000F00AC"}
                  - label: {align: center, y: 22, styles: nav_label, text: "Blinds"}
                on_click:
                  - lvgl.page.show: {id: blinds_page, animation: OVER_TOP, time: 140ms}
            - button:
                width: 180
                height: 124
                bg_opa: TRANSP
                border_width: 0
                shadow_width: 0
                widgets:
                  - label: {id: nav_settings_icon, align: center, y: -14, text_font: mdi_36, text_color: 0x3D3D46, text: "\U000F0493"}
                  - label: {align: center, y: 22, styles: nav_label, text: "Settings"}
                on_click:
                  - lvgl.page.show: {id: settings_page, animation: OVER_TOP, time: 140ms}
  pages:
    # ---------- ROOM (home) ----------
    - id: room_page
      styles: page_bg
      on_load:
        - lvgl.widget.update: {id: nav_lights_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_climate_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_blinds_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_settings_icon, text_color: 0x3D3D46}
        - script.execute: refresh_media
      widgets:
        - label: {id: clock_label, align: top_mid, y: 60, text_font: clock_font, text_color: 0xE8E8E4, text: "--:--"}
        - label: {id: date_label, align: top_mid, y: 176, text_font: montserrat_24, text_color: 0x6F6F77, text: "Master bedroom"}
        - obj:
            align: top_mid
            y: 250
            width: 656
            height: 140
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: space_between
              flex_align_cross: center
            widgets:
              - button:
                  id: soft_btn
                  width: 314
                  height: 140
                  styles: tile
                  checked: {bg_color: 0x1D9E75, bg_opa: 30%, border_color: 0x1D9E75, border_opa: 100%}
                  widgets:
                    - label: {align: top_mid, y: 18, text_font: mdi_36, text_color: 0x9FE1CB, text: "\U000F0594"}
                    - label: {align: bottom_mid, y: -16, text_font: montserrat_26, text_color: 0xB8B8BF, text: "Soft"}
                  on_click:
                    - light.turn_on: {id: downlights, brightness: 35%}
                    - light.turn_on: {id: lamp, brightness: 30%}
                    - lvgl.widget.update: {id: soft_btn, state: {checked: true}}
                    - lvgl.widget.update: {id: bright_btn, state: {checked: false}}
              - button:
                  id: bright_btn
                  width: 314
                  height: 140
                  styles: tile
                  checked: {bg_color: 0x1D9E75, bg_opa: 30%, border_color: 0x1D9E75, border_opa: 100%}
                  widgets:
                    - label: {align: top_mid, y: 18, text_font: mdi_36, text_color: 0xE1E1D8, text: "\U000F05A8"}
                    - label: {align: bottom_mid, y: -16, text_font: montserrat_26, text_color: 0xB8B8BF, text: "Bright"}
                  on_click:
                    - light.turn_on: {id: downlights, brightness: 100%}
                    - light.turn_on: {id: lamp, brightness: 100%}
                    - lvgl.widget.update: {id: bright_btn, state: {checked: true}}
                    - lvgl.widget.update: {id: soft_btn, state: {checked: false}}
        # --- mini now-playing (hidden when nothing is on) ---
        - button:
            id: room_media_box
            align: top_mid
            y: 410
            width: 656
            height: 170
            styles: tile
            widgets:
              - obj:
                  align: top_left
                  x: 20
                  y: 18
                  width: 64
                  height: 64
                  bg_color: 0x1A1A22
                  border_width: 1
                  border_color: 0x2E2E34
                  radius: 12
                  pad_all: 0
                  widgets:
                    - label: {align: center, text_font: mdi_36, text_color: 0x8A8A92, text: "\U000F075A"}
              - label: {id: room_media_title, align: top_left, x: 100, y: 24, text_font: montserrat_22, text_color: 0xD8D8DE, text: "Nothing playing"}
              - label: {id: room_media_artist, align: top_left, x: 100, y: 54, text_font: montserrat_18, text_color: 0x6F6F77, text: ""}
              - label: {id: room_play_icon, align: top_right, x: -24, y: 32, text_font: mdi_36, text_color: 0x9FE1CB, text: "\U000F040A"}
              - slider:
                  id: room_vol_slider
                  align: bottom_mid
                  y: -18
                  width: 600
                  height: 26
                  min_value: 0
                  max_value: 100
                  anim_duration: 250ms
                  radius: 13
                  bg_color: 0x1F1F24
                  bg_opa: COVER
                  indicator: {bg_color: 0x0F6E56, radius: 13}
                  knob: {bg_opa: TRANSP, pad_all: 0}
                  on_release:
                    - homeassistant.action:
                        action: media_player.volume_set
                        data_template:
                          entity_id: "{{ target }}"
                          volume_level: "{{ vol }}"
                        variables:
                          target: !lambda |-
                            switch (id(media_target)) {
                              case 0: return std::string("media_player.lounge_room_tv");
                              case 1: return std::string("media_player.kitchen_display");
                              case 2: return std::string("media_player.shed_speaker_2");
                              case 3: return std::string("media_player.archer_s_speaker");
                              case 4: return std::string("media_player.kids");
                            }
                            return std::string("");
                          vol: !lambda |-
                            char buf[16]; snprintf(buf, sizeof(buf), "%.2f", x / 100.0f);
                            return std::string(buf);
            on_click:
              - lvgl.page.show: {id: media_page, animation: OVER_TOP, time: 200ms}
        - button:
            id: goodnight_btn
            align: bottom_mid
            y: -132
            width: 656
            height: 96
            styles: tile
            widgets:
              - label: {align: left_mid, x: 28, text_font: mdi_36, text_color: 0xAFA9EC, text: "\U000F0594"}
              - label: {align: left_mid, x: 84, text_font: montserrat_26, text_color: 0xB8B8BF, text: "Goodnight"}
            on_click:
              - light.turn_off: downlights
              - light.turn_off: lamp
              - lvgl.widget.update: {id: soft_btn, state: {checked: false}}
              - lvgl.widget.update: {id: bright_btn, state: {checked: false}}
              - homeassistant.action: {action: script.master_bedroom_goodnight}

    # ---------- LIGHTS ----------
    - id: lights_page
      styles: page_bg
      on_load:
        - lvgl.widget.update: {id: nav_lights_icon, text_color: 0x5DCAA5}
        - lvgl.widget.update: {id: nav_climate_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_blinds_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_settings_icon, text_color: 0x3D3D46}
      widgets:
        # Matches the Pi's `.down` control — every sheet closes back to the room,
        # which is the only way home now that the nav has no Room button.
        - button:
            align: top_left
            x: 24
            y: 26
            width: 78
            height: 70
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            widgets:
              - label: {align: center, text_font: mdi_36, text_color: 0x6F6F77, text: "\U000F0140"}
            on_click:
              - lvgl.page.show: {id: room_page, animation: OUT_BOTTOM, time: 140ms}
        - label: {align: top_mid, y: 44, text_font: montserrat_28, text_color: 0xD8D8DE, text: "Lights"}
        - label: {align: top_left, x: 40, y: 170, text_font: montserrat_26, text_color: 0xB8B8BF, text: "Downlights"}
        - label: {id: dl_pct, align: top_right, x: -40, y: 172, text_font: montserrat_22, text_color: 0x6F6F77, text: "Off"}
        - slider:
            id: dl_slider
            anim_duration: 250ms
            align: top_mid
            y: 220
            width: 640
            height: 64
            min_value: 0
            max_value: 100
            value: 0
            radius: 32
            bg_color: 0x1F1F24
            bg_opa: COVER
            indicator: {bg_color: 0x0F6E56, radius: 32}
            knob: {bg_opa: TRANSP, pad_all: 0}
            on_release:
              - lvgl.widget.update: {id: soft_btn, state: {checked: false}}
              - lvgl.widget.update: {id: bright_btn, state: {checked: false}}
              - if:
                  condition: {lambda: 'return x < 1;'}
                  then: [{light.turn_off: downlights}]
                  else:
                    - light.turn_on: {id: downlights, brightness: !lambda 'return x / 100.0;'}
        - label: {align: top_left, x: 40, y: 340, text_font: montserrat_26, text_color: 0xB8B8BF, text: "Lamp"}
        - label: {id: lamp_pct, align: top_right, x: -40, y: 342, text_font: montserrat_22, text_color: 0x6F6F77, text: "Off"}
        - slider:
            id: lamp_slider
            anim_duration: 250ms
            align: top_mid
            y: 390
            width: 640
            height: 64
            min_value: 0
            max_value: 100
            value: 0
            radius: 32
            bg_color: 0x1F1F24
            bg_opa: COVER
            indicator: {bg_color: 0x0F6E56, radius: 32}
            knob: {bg_opa: TRANSP, pad_all: 0}
            on_release:
              - lvgl.widget.update: {id: soft_btn, state: {checked: false}}
              - lvgl.widget.update: {id: bright_btn, state: {checked: false}}
              - if:
                  condition: {lambda: 'return x < 1;'}
                  then: [{light.turn_off: lamp}]
                  else:
                    - light.turn_on: {id: lamp, brightness: !lambda 'return x / 100.0;'}

    # ---------- MEDIA (reached by tapping the room mini-player) ----------
    - id: media_page
      styles: page_bg
      widgets:
        - button:
            align: top_left
            x: 24
            y: 26
            width: 78
            height: 70
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            widgets:
              - label: {align: center, text_font: mdi_36, text_color: 0x6F6F77, text: "\U000F0140"}
            on_click:
              - lvgl.page.show: {id: room_page, animation: OUT_BOTTOM, time: 140ms}
        - label: {align: top_mid, y: 44, text_font: montserrat_28, text_color: 0xD8D8DE, text: "Media"}
        - obj:
            align: top_mid
            y: 130
            width: 200
            height: 200
            bg_color: 0x1A1A22
            border_width: 1
            border_color: 0x2E2E34
            radius: 16
            pad_all: 0
            widgets:
              - label: {align: center, text_font: mdi_36, text_color: 0x4A4A52, text: "\U000F075A"}
        - label: {id: media_title_lbl, align: top_mid, y: 356, text_font: montserrat_26, text_color: 0xE8E8E4, text: "Nothing playing"}
        - label: {id: media_artist_lbl, align: top_mid, y: 394, text_font: montserrat_20, text_color: 0x6F6F77, text: ""}
        - button:
            align: top_mid
            x: -150
            y: 450
            width: 90
            height: 90
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            widgets:
              - label: {align: center, text_font: mdi_36, text_color: 0xB8B8BF, text: "\U000F04AE"}
            on_click:
              - script.execute: {id: media_cmd, act: 'media_previous_track'}
        - button:
            id: media_play_btn
            align: top_mid
            y: 450
            width: 110
            height: 90
            styles: tile
            widgets:
              - label: {id: media_play_icon, align: center, text_font: mdi_36, text_color: 0x5DCAA5, text: "\U000F040A"}
            on_click:
              - script.execute: {id: media_cmd, act: 'media_play_pause'}
        - button:
            align: top_mid
            x: 150
            y: 450
            width: 90
            height: 90
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            widgets:
              - label: {align: center, text_font: mdi_36, text_color: 0xB8B8BF, text: "\U000F04AD"}
            on_click:
              - script.execute: {id: media_cmd, act: 'media_next_track'}
        - slider:
            id: media_vol_slider
            anim_duration: 250ms
            align: top_mid
            y: 570
            width: 640
            height: 64
            min_value: 0
            max_value: 100
            radius: 32
            bg_color: 0x1F1F24
            bg_opa: COVER
            indicator: {bg_color: 0x0F6E56, radius: 32}
            knob: {bg_opa: TRANSP, pad_all: 0}
            on_release:
              - homeassistant.action:
                  action: media_player.volume_set
                  data_template:
                    entity_id: "{{ target }}"
                    volume_level: "{{ vol }}"
                  variables:
                    target: !lambda |-
                      switch (id(media_target)) {
                        case 0: return std::string("media_player.lounge_room_tv");
                        case 1: return std::string("media_player.kitchen_display");
                        case 2: return std::string("media_player.shed_speaker_2");
                        case 3: return std::string("media_player.archer_s_speaker");
                        case 4: return std::string("media_player.kids");
                      }
                      return std::string("");
                    vol: !lambda |-
                      char buf[16]; snprintf(buf, sizeof(buf), "%.2f", x / 100.0f);
                      return std::string(buf);
        - label: {align: top_left, x: 40, y: 660, text_font: montserrat_20, text_color: 0x6F6F77, text: "Playing on"}
        - label: {id: speaker_current, align: top_right, x: -40, y: 660, text_font: montserrat_20, text_color: 0x9FE1CB, text: "Lounge TV"}
        - button:
            align: top_mid
            y: 700
            width: 640
            height: 64
            styles: tile
            widgets:
              - label: {align: left_mid, x: 20, text_font: montserrat_22, text_color: 0xB8B8BF, text: "Lounge TV"}
            on_click:
              - lambda: 'id(media_target) = 0;'
              - script.execute: refresh_media
        - button:
            align: top_mid
            y: 774
            width: 640
            height: 64
            styles: tile
            widgets:
              - label: {align: left_mid, x: 20, text_font: montserrat_22, text_color: 0xB8B8BF, text: "Kitchen"}
            on_click:
              - lambda: 'id(media_target) = 1;'
              - script.execute: refresh_media
        - button:
            align: top_mid
            y: 848
            width: 640
            height: 64
            styles: tile
            widgets:
              - label: {align: left_mid, x: 20, text_font: montserrat_22, text_color: 0xB8B8BF, text: "Shed"}
            on_click:
              - lambda: 'id(media_target) = 2;'
              - script.execute: refresh_media
        - button:
            align: top_mid
            y: 922
            width: 640
            height: 64
            styles: tile
            widgets:
              - label: {align: left_mid, x: 20, text_font: montserrat_22, text_color: 0xB8B8BF, text: "Archer's"}
            on_click:
              - lambda: 'id(media_target) = 3;'
              - script.execute: refresh_media
        - button:
            align: top_mid
            y: 996
            width: 640
            height: 64
            styles: tile
            widgets:
              - label: {align: left_mid, x: 20, text_font: montserrat_22, text_color: 0xB8B8BF, text: "Kids"}
            on_click:
              - lambda: 'id(media_target) = 4;'
              - script.execute: refresh_media

    # ---------- CLIMATE / BLINDS placeholders ----------
    - id: climate_page
      styles: page_bg
      on_load:
        - lvgl.widget.update: {id: nav_lights_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_climate_icon, text_color: 0x5DCAA5}
        - lvgl.widget.update: {id: nav_blinds_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_settings_icon, text_color: 0x3D3D46}
      widgets:
        - button:
            align: top_left
            x: 24
            y: 26
            width: 78
            height: 70
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            widgets:
              - label: {align: center, text_font: mdi_36, text_color: 0x6F6F77, text: "\U000F0140"}
            on_click:
              - lvgl.page.show: {id: room_page, animation: OUT_BOTTOM, time: 140ms}
        - label: {align: center, y: -60, text_font: mdi_36, text_color: 0x55555C, text: "\U000F050F"}
        - label: {align: center, text_font: montserrat_26, text_color: 0x8A8A92, text: "Climate"}
        - label: {align: center, y: 44, text_font: montserrat_22, text_color: 0x55555C, text: "Not set up yet"}
    - id: blinds_page
      styles: page_bg
      on_load:
        - lvgl.widget.update: {id: nav_lights_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_climate_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_blinds_icon, text_color: 0x5DCAA5}
        - lvgl.widget.update: {id: nav_settings_icon, text_color: 0x3D3D46}
      widgets:
        - button:
            align: top_left
            x: 24
            y: 26
            width: 78
            height: 70
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            widgets:
              - label: {align: center, text_font: mdi_36, text_color: 0x6F6F77, text: "\U000F0140"}
            on_click:
              - lvgl.page.show: {id: room_page, animation: OUT_BOTTOM, time: 140ms}
        - label: {align: center, y: -60, text_font: mdi_36, text_color: 0x55555C, text: "\U000F00AC"}
        - label: {align: center, text_font: montserrat_26, text_color: 0x8A8A92, text: "Blinds"}
        - label: {align: center, y: 44, text_font: montserrat_22, text_color: 0x55555C, text: "Not set up yet"}

    # ---------- SETTINGS ----------
    - id: settings_page
      styles: page_bg
      on_load:
        - lvgl.widget.update: {id: nav_lights_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_climate_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_blinds_icon, text_color: 0x3D3D46}
        - lvgl.widget.update: {id: nav_settings_icon, text_color: 0x5DCAA5}
      widgets:
        - button:
            align: top_left
            x: 24
            y: 26
            width: 78
            height: 70
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            widgets:
              - label: {align: center, text_font: mdi_36, text_color: 0x6F6F77, text: "\U000F0140"}
            on_click:
              - lvgl.page.show: {id: room_page, animation: OUT_BOTTOM, time: 140ms}
        - label: {align: top_mid, y: 44, text_font: montserrat_28, text_color: 0xD8D8DE, text: "Settings"}
        - label: {align: top_left, x: 40, y: 150, text_font: montserrat_26, text_color: 0xB8B8BF, text: "Backlight"}
        - slider:
            id: backlight_slider
            anim_duration: 250ms
            align: top_mid
            y: 200
            width: 640
            height: 64
            min_value: 5
            max_value: 100
            value: 100
            radius: 32
            bg_color: 0x1F1F24
            bg_opa: COVER
            indicator: {bg_color: 0x0F6E56, radius: 32}
            knob: {bg_opa: TRANSP, pad_all: 0}
            on_release:
              - light.turn_on: {id: backlight, brightness: !lambda 'return x / 100.0;'}
        - obj:
            align: top_mid
            y: 320
            width: 656
            height: 240
            styles: tile
            pad_all: 0
            widgets:
              - label: {align: top_left, x: 28, y: 26, text_font: montserrat_22, text_color: 0x8A8A92, text: "IP address"}
              - label: {id: ip_value, align: top_right, x: -28, y: 26, text_font: montserrat_22, text_color: 0xD8D8DE, text: "-"}
              - label: {align: top_left, x: 28, y: 104, text_font: montserrat_22, text_color: 0x8A8A92, text: "Version"}
              - label: {id: version_value, align: top_right, x: -28, y: 104, text_font: montserrat_22, text_color: 0xD8D8DE, text: "-"}
              - label: {align: top_left, x: 28, y: 182, text_font: montserrat_22, text_color: 0x8A8A92, text: "Uptime"}
              - label: {id: uptime_value, align: top_right, x: -28, y: 182, text_font: montserrat_22, text_color: 0xD8D8DE, text: "-"}
        - button:
            align: top_mid
            y: 600
            width: 656
            height: 96
            styles: tile
            widgets:
              - label: {align: center, text_font: montserrat_24, text_color: 0xF0997B, text: "Restart panel"}
            on_click:
              - button.press: restart_btn

    # ---------- IDLE / STANDBY ----------
    - id: idle_page
      bg_color: 0x000000
      pad_all: 0
      widgets:
        - button:
            align: center
            width: 720
            height: 1280
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            radius: 0
            widgets:
              - label: {id: idle_clock_label, align: center, y: -120, text_font: clock_font, text_color: 0x4A4A52, text: "--:--"}
              - obj:
                  id: idle_media_box
                  align: center
                  y: 60
                  width: 400
                  height: 170
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  widgets:
                    - obj:
                        align: top_mid
                        width: 76
                        height: 76
                        bg_color: 0x101018
                        border_width: 1
                        border_color: 0x1E1E28
                        radius: 10
                        pad_all: 0
                        widgets:
                          - label: {align: center, text_font: mdi_36, text_color: 0x2E2E38, text: "\U000F075A"}
                    - label: {id: idle_media_title, align: top_mid, y: 92, text_font: montserrat_20, text_color: 0x5A5A63, text: ""}
                    - label: {id: idle_media_artist, align: top_mid, y: 122, text_font: montserrat_18, text_color: 0x3D3D46, text: ""}
              - label: {align: bottom_mid, y: -80, text_font: montserrat_18, text_color: 0x2E2E38, text: "Tap to wake"}
            on_press:
              - light.turn_on: {id: backlight, brightness: 100%}
              - lvgl.widget.show: navbar
              - lvgl.page.show: {id: room_page, animation: NONE}

