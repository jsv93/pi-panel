substitutions:
  # Panel config server. Set this to your server's address — mDNS names
  # generally do not resolve here, so use an IP.
  panel_server: "http://192.168.1.10:8099"

esphome:
  name: panel-poc
  friendly_name: Wall Panel PoC
  on_boot:
    # Panel controller wake — lifted from Waveshare esp_lcd_hx8394.c, which runs
    # this BEFORE creating the DPI panel. Without it the LCD never powers up and
    # the first DSI writes after sleep-out block forever -> task WDT reset loop
    # (this exact symptom is documented for the 10.1" sibling in esphome#15564).
    # Priority 800: after the I2C bus (1000), before display setup. Must be a
    # single blocking lambda — an async `delay:` action would NOT hold setup.
    priority: 800
    then:
      - lambda: |-
          id(backlight_ctrl).write_byte(0x95, 0x11);
          id(backlight_ctrl).write_byte(0x95, 0x17);   // panel power/enable
          id(backlight_ctrl).write_byte(0x96, 0x00);   // backlight off
          delay(100);
          id(backlight_ctrl).write_byte(0x96, 0xFF);   // backlight full
          delay(1000);  // vendor waits 1s before DPI panel creation

esp32:
  variant: esp32p4
  cpu_frequency: 360MHz
  flash_size: 32MB       # board has 32MB NOR (was running as 4MB) — NOTE: partition
                         # table changes, so this flash must go over USB, not OTA
  engineering_sample: true  # rev v1.3 silicon (< v3.0)
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true  # required for OTA on 32MB flash
    sdkconfig_options:
      # --- XIP experiment: proven in the LVGL9 demo (7 -> 63 fps ceiling) ---
      # Execute code from 200MHz PSRAM instead of 40MHz DIO flash. Engineering-
      # sample P4 silicon can't run flash above 40MHz; this bypasses it.
      CONFIG_SPIRAM_XIP_FROM_PSRAM: "y"
      # Larger L2 cache, wider lines (matches the demo config)
      CONFIG_CACHE_L2_CACHE_256KB: "y"
      CONFIG_CACHE_L2_CACHE_LINE_128B: "y"

logger:
  hardware_uart: UART0   # board's USB-C is CH343 on UART0; P4 default (USB_SERIAL_JTAG) is unreachable here

api:   # add `encryption:` key when adopting properly into HA

ota:
  - platform: esphome

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  phy_addr: 1     # IP101 straps to SMI address 1 on Waveshare P4 boards
  clk:
    pin: GPIO50
    mode: CLK_EXT_IN

psram:
  speed: 200MHz   # CRITICAL: P4 default is 20MHz -> DPI underrun + DSI wedge + WDT

esp_ldo:
  - channel: 3
    voltage: 2.5V

i2c:
  sda: GPIO7
  scl: GPIO8
  frequency: 400kHz

i2c_device:
  id: backlight_ctrl
  address: 0x45

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

globals:
  - id: media_target
    type: int
    restore_value: true
    initial_value: '0'
  - id: cur_state
    type: std::string
    restore_value: false
  - id: cur_title
    type: std::string
    restore_value: false
  - id: cur_artist
    type: std::string
    restore_value: false
  - id: cur_vol
    type: float
    restore_value: false
    initial_value: '0'
  - id: server_registered
    type: bool
    restore_value: false
    initial_value: 'false'

http_request:
  id: panel_http
  useragent: esphome/panel-poc
  timeout: 5s

# Reports identity and version to the config server so the fleet view can show
# this panel and flag firmware drift. Deliberately one-way: the panel tells the
# server what it is and takes no commands back. If the server is unreachable
# the registration simply keeps retrying and nothing else is affected.
interval:
  - interval: 15s
    then:
      - if:
          condition:
            lambda: 'return !id(server_registered) && !id(eth_ip).state.empty();'
          then:
            - http_request.post:
                url: ${panel_server}/api/register
                request_headers:
                  Content-Type: application/json
                body: !lambda |-
                  char buf[320];
                  snprintf(buf, sizeof(buf),
                    "{\"panel_id\":\"%s\",\"hostname\":\"%s\",\"mac\":\"%s\","
                    "\"ip\":\"%s\",\"kind\":\"esp\",\"version\":\"%s\"}",
                    App.get_name().c_str(), App.get_name().c_str(),
                    get_mac_address_pretty().c_str(), id(eth_ip).state.c_str(),
                    ESPHOME_VERSION);
                  return std::string(buf);
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 200) {
                          id(server_registered) = true;
                          ESP_LOGI("panel", "registered with ${panel_server}");
                        } else {
                          ESP_LOGW("panel", "register to ${panel_server} returned %d",
                                   response->status_code);
                        }
            - lambda: |-
                // Logged unconditionally: if the POST never completes there is
                // no on_response at all, and silence is indistinguishable from
                // "not trying". This line proves the interval is firing.
                if (!id(server_registered))
                  ESP_LOGI("panel", "register attempt -> ${panel_server}, ip=%s",
                           id(eth_ip).state.c_str());
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(server_registered);'
          then:
            - http_request.post:
                url: ${panel_server}/api/heartbeat
                request_headers:
                  Content-Type: application/json
                body: !lambda |-
                  char buf[256];
                  snprintf(buf, sizeof(buf),
                    "{\"panel_id\":\"%s\",\"config_version\":0,"
                    "\"metrics\":{\"ui_version\":\"%s\",\"uptime\":%u}}",
                    App.get_name().c_str(), ESPHOME_VERSION,
                    (unsigned) (millis() / 1000));
                  return std::string(buf);
                on_response:
                  then:
                    - lambda: |-
                        // A panel removed from the fleet 404s here; re-register
                        // so it comes back as unclaimed rather than going quiet.
                        if (response->status_code == 404) id(server_registered) = false;

text_sensor:
  - platform: version
    name: "ESPHome Version"
    on_value:
      - lvgl.label.update: {id: version_value, text: !lambda 'return x;'}
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      id: eth_ip
      on_value:
        - lvgl.label.update: {id: ip_value, text: !lambda 'return x;'}
  - platform: homeassistant
    id: p0_state
    entity_id: media_player.lounge_room_tv
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p0_title
    entity_id: media_player.lounge_room_tv
    attribute: media_title
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p0_artist
    entity_id: media_player.lounge_room_tv
    attribute: media_artist
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p1_state
    entity_id: media_player.kitchen_display
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p1_title
    entity_id: media_player.kitchen_display
    attribute: media_title
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p1_artist
    entity_id: media_player.kitchen_display
    attribute: media_artist
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p2_state
    entity_id: media_player.shed_speaker_2
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p2_title
    entity_id: media_player.shed_speaker_2
    attribute: media_title
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p2_artist
    entity_id: media_player.shed_speaker_2
    attribute: media_artist
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p3_state
    entity_id: media_player.archer_s_speaker
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p3_title
    entity_id: media_player.archer_s_speaker
    attribute: media_title
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p3_artist
    entity_id: media_player.archer_s_speaker
    attribute: media_artist
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p4_state
    entity_id: media_player.kids
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p4_title
    entity_id: media_player.kids
    attribute: media_title
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p4_artist
    entity_id: media_player.kids
    attribute: media_artist
    on_value:
      - script.execute: refresh_media

sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_s
    on_value:
      - lvgl.label.update:
          id: uptime_value
          text: !lambda |-
            int s = (int) x;
            char buf[24]; snprintf(buf, sizeof(buf), "%dd %dh", s / 86400, (s % 86400) / 3600);
            return std::string(buf);
  - platform: homeassistant
    id: p0_vol
    entity_id: media_player.lounge_room_tv
    attribute: volume_level
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p1_vol
    entity_id: media_player.kitchen_display
    attribute: volume_level
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p2_vol
    entity_id: media_player.shed_speaker_2
    attribute: volume_level
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p3_vol
    entity_id: media_player.archer_s_speaker
    attribute: volume_level
    on_value:
      - script.execute: refresh_media
  - platform: homeassistant
    id: p4_vol
    entity_id: media_player.kids
    attribute: volume_level
    on_value:
      - script.execute: refresh_media

  # The nav bar's Climate button shows the room temperature rather than an
  # icon, matching the Pi. Point this at the room's sensor and uncomment; the
  # label reads "--°" until it reports.
  # - platform: homeassistant
  #   id: room_temp
  #   entity_id: sensor.CHANGEME_temperature
  #   on_value:
  #     - lvgl.label.update:
  #         id: nav_climate_icon
  #         text: !lambda |-
  #           char buf[12]; snprintf(buf, sizeof(buf), "%.0f°", x);
  #           return std::string(buf);

script:
  - id: update_clock
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
      - lvgl.label.update:
          id: idle_clock_label
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            return now.strftime("%H:%M");
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("Master bedroom");
            return now.strftime("%a %d %b") + std::string("  \xC2\xB7  Master bedroom");

  # Pulls the selected player's state into globals, then refreshes every
  # media widget (room mini-player, media page, idle page) and shows/hides
  # the blocks depending on whether anything is actually playing.
  - id: refresh_media
    mode: restart
    then:
      - lambda: |-
          std::string s = "", t = "", a = ""; float v = 0;
          switch (id(media_target)) {
            case 0: s = id(p0_state).state; t = id(p0_title).state; a = id(p0_artist).state; v = id(p0_vol).state; break;
            case 1: s = id(p1_state).state; t = id(p1_title).state; a = id(p1_artist).state; v = id(p1_vol).state; break;
            case 2: s = id(p2_state).state; t = id(p2_title).state; a = id(p2_artist).state; v = id(p2_vol).state; break;
            case 3: s = id(p3_state).state; t = id(p3_title).state; a = id(p3_artist).state; v = id(p3_vol).state; break;
            case 4: s = id(p4_state).state; t = id(p4_title).state; a = id(p4_artist).state; v = id(p4_vol).state; break;
          }
          id(cur_state) = s; id(cur_title) = t; id(cur_artist) = a;
          id(cur_vol) = (v > 0 && v <= 1.0f) ? v * 100.0f : v;
          ESP_LOGD("media", "target=%d state='%s' title='%s' artist='%s' vol=%.0f",
                   id(media_target), s.c_str(), t.c_str(), a.c_str(), id(cur_vol));
      - lvgl.label.update:
          id: room_media_title
          text: !lambda 'return id(cur_title).empty() ? std::string("Nothing playing") : id(cur_title);'
      - lvgl.label.update:
          id: room_media_artist
          text: !lambda 'return id(cur_artist);'
      - lvgl.label.update:
          id: media_title_lbl
          text: !lambda 'return id(cur_title).empty() ? std::string("Nothing playing") : id(cur_title);'
      - lvgl.label.update:
          id: media_artist_lbl
          text: !lambda |-
            std::string who = "";
            switch (id(media_target)) {
              case 0: return std::string("Lounge TV");
              case 1: return std::string("Kitchen");
              case 2: return std::string("Shed");
              case 3: return std::string("Archer's");
              case 4: return std::string("Kids");
            }
            if (id(cur_artist).empty()) return who;
            return id(cur_artist) + std::string("  \xC2\xB7  ") + who;
      - lvgl.label.update:
          id: idle_media_title
          text: !lambda 'return id(cur_title);'
      - lvgl.label.update:
          id: idle_media_artist
          text: !lambda 'return id(cur_artist);'
      - lvgl.label.update:
          id: speaker_current
          text: !lambda |-
            switch (id(media_target)) {
              case 0: return std::string("Lounge TV");
              case 1: return std::string("Kitchen");
              case 2: return std::string("Shed");
              case 3: return std::string("Archer's");
              case 4: return std::string("Kids");
            }
            return std::string("-");
      - lvgl.slider.update:
          id: room_vol_slider
          animated: true
          value: !lambda 'return id(cur_vol);'
      - lvgl.slider.update:
          id: media_vol_slider
          animated: true
          value: !lambda 'return id(cur_vol);'
      - lvgl.label.update:
          id: media_play_icon
          text: !lambda 'return id(cur_state) == "playing" ? std::string("\U000F03E4") : std::string("\U000F040A");'
      - lvgl.label.update:
          id: room_play_icon
          text: !lambda 'return id(cur_state) == "playing" ? std::string("\U000F03E4") : std::string("\U000F040A");'
      # Collapse the room mini-player and idle now-playing when idle/off
      - if:
          condition:
            lambda: |-
              // Show whenever the player is awake and doing something: a TV
              // reports "on"/"idle" rather than "playing", and some sources
              // never populate media_title.
              const std::string &s = id(cur_state);
              if (s == "off" || s == "unavailable" || s == "unknown" || s.empty()) return false;
              return true;
          then:
            - lvgl.widget.show: room_media_box
            - lvgl.widget.show: idle_media_box
          else:
            - lvgl.widget.hide: room_media_box
            - lvgl.widget.hide: idle_media_box

  # Fires a media_player action against whichever player is selected.
  - id: media_cmd
    parameters:
      act: string
    then:
      - homeassistant.action:
          action: !lambda 'return "media_player." + act;'
          data_template:
            entity_id: "{{ target }}"
          variables:
            target: !lambda |-
              switch (id(media_target)) {
                case 0: return std::string("media_player.lounge_room_tv");
                case 1: return std::string("media_player.kitchen_display");
                case 2: return std::string("media_player.shed_speaker_2");
                case 3: return std::string("media_player.archer_s_speaker");
                case 4: return std::string("media_player.kids");
              }
              return std::string("");

font:
  - file: "https://raw.githubusercontent.com/googlefonts/roboto-2/main/src/hinted/Roboto-Light.ttf"
    id: clock_font
    size: 84
    glyphs: "0123456789:-"
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_36
    size: 36
    glyphs: [
      "\U000F0335",  # lightbulb
      "\U000F050F",  # thermometer
      "\U000F00AC",  # blinds
      "\U000F0493",  # cog
      "\U000F0594",  # weather-night
      "\U000F05A8",  # white-balance-sunny
      "\U000F004D",  # arrow-left
      "\U000F02DC",  # home
      "\U000F075A",  # music
      "\U000F03E4",  # pause
      "\U000F040A",  # play
      "\U000F04AD",  # skip-next
      "\U000F04AE",  # skip-previous
      "\U000F057E",  # volume
      "\U000F0140",  # chevron-down
    ]

output:
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - lambda: |-
          id(backlight_ctrl).write_byte(0x96, (uint8_t)(state * 255.0f));
  - platform: template
    id: downlights_out
    type: float
    write_action:
      - lambda: 'ESP_LOGD("panel", "Downlights -> %.0f%%", state * 100.0f);'
  - platform: template
    id: lamp_out
    type: float
    write_action:
      - lambda: 'ESP_LOGD("panel", "Lamp -> %.0f%%", state * 100.0f);'

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    gamma_correct: 1.0
  - platform: monochromatic
    id: downlights
    name: "Downlights (test)"
    output: downlights_out
    default_transition_length: 0s
    on_state:
      - lvgl.slider.update:
          id: dl_slider
          animated: true
          value: !lambda 'return id(downlights).current_values.is_on() ? id(downlights).current_values.get_brightness() * 100.0f : 0.0f;'
      - lvgl.label.update:
          id: dl_pct
          text: !lambda |-
            if (!id(downlights).current_values.is_on()) return std::string("Off");
            char buf[8]; snprintf(buf, sizeof(buf), "%.0f%%", id(downlights).current_values.get_brightness() * 100.0f);
            return std::string(buf);
  - platform: monochromatic
    id: lamp
    name: "Lamp (test)"
    output: lamp_out
    default_transition_length: 0s
    on_state:
      - lvgl.slider.update:
          id: lamp_slider
          animated: true
          value: !lambda 'return id(lamp).current_values.is_on() ? id(lamp).current_values.get_brightness() * 100.0f : 0.0f;'
      - lvgl.label.update:
          id: lamp_pct
          text: !lambda |-
            if (!id(lamp).current_values.is_on()) return std::string("Off");
            char buf[8]; snprintf(buf, sizeof(buf), "%.0f%%", id(lamp).current_values.get_brightness() * 100.0f);
            return std::string(buf);

display:
  # 5-DSI-TOUCH-A: HX8394 driver IC — no native ESPHome model (the 7" entry is
  # ILI9881C and will NOT init this panel). CUSTOM init + timings lifted from
  # Waveshare's official esp_lcd_hx8394 ESP-IDF component (waveshareteam/
  # Waveshare-ESP32-components, display/lcd/esp_lcd_hx8394).
  - platform: mipi_dsi
    id: panel_display
    model: CUSTOM
    dimensions:
      width: 720
      height: 1280
    hsync_back_porch: 20
    hsync_pulse_width: 20
    hsync_front_porch: 40
    vsync_back_porch: 10
    vsync_pulse_width: 4
    vsync_front_porch: 24
    pclk_frequency: 58MHz
    lane_bit_rate: 700Mbps    # HX8394_PANEL_BUS_DSI_2CH_CONFIG
    color_order: rgb
    pixel_mode: 16bit         # ESPHome sends COLMOD 0x55; vendor uses 0x50 — same
                              # 16bpp DPI format, low nibble (DBI) unused in video mode
    auto_clear_enabled: false
    init_sequence:
      - [0xB9, 0xFF, 0x83, 0x94]
      - [0xB1, 0x48, 0x0A, 0x6A, 0x09, 0x33, 0x54, 0x71, 0x71, 0x2E, 0x45]
      - [0xBA, 0x61, 0x03, 0x68, 0x6B, 0xB2, 0xC0]
      - [0xB2, 0x00, 0x80, 0x64, 0x0C, 0x06, 0x2F]
      - [0xB4, 0x1C, 0x78, 0x1C, 0x78, 0x1C, 0x78, 0x01, 0x0C, 0x86, 0x75, 0x00, 0x3F, 0x1C, 0x78, 0x1C, 0x78, 0x1C, 0x78, 0x01, 0x0C, 0x86]
      - [0xD3, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x08, 0x08, 0x32, 0x10, 0x05, 0x00, 0x05, 0x32, 0x13, 0xC1, 0x00, 0x01, 0x32, 0x10, 0x08, 0x00, 0x00, 0x37, 0x03, 0x07, 0x07, 0x37, 0x05, 0x05, 0x37, 0x0C, 0x40]
