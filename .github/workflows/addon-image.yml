name: Add-on image

# Builds the image the Home Assistant add-on pulls. Home Assistant substitutes
# {arch} into the image name, so each architecture is pushed under its own
# name rather than as one multi-arch manifest.
#
# Tag a release to publish: `git tag v0.1.0 && git push --tags`. The tag must
# match the `version` in the add-on's config.yaml, or Home Assistant will try
# to pull an image that does not exist.
#
# Uses the docker CLI directly rather than the marketplace actions. Those have
# to be downloaded from codeload at the start of every run, and repeated 429s
# there failed builds that had not started -- nothing to do with the build
# itself, and nothing a retry fixed. docker and buildx are already on the
# runner, so actions/checkout is the only download left.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish (e.g. 0.1.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the add-on manifest agrees
        run: |
          # A mismatch here is invisible until Home Assistant tries to pull a
          # tag that was never pushed, so fail now rather than then.
          want='${{ steps.v.outputs.version }}'
          have=$(grep -E '^version:' addon/panel-server/config.yaml | cut -d'"' -f2)
          if [ "$want" != "$have" ]; then
            echo "config.yaml says $have, publishing $want — bump one to match." >&2
            exit 1
          fi

      - name: Enable arm64 emulation
        if: matrix.arch == 'aarch64'
        # binfmt handlers for cross-building; the image is pulled from Docker
        # Hub rather than fetched as an action.
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Set up buildx
        run: docker buildx create --name panel --use --driver docker-container

      - name: Log in to ghcr.io
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pi-panel-server-${{ matrix.arch }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Context is the repository root: the image bakes in panel.html, the
          # agent and the backlight helper, which live outside server/.
          docker buildx build \
            --platform '${{ matrix.platform }}' \
            --file ./server/Dockerfile \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            --push \
            .

      - name: Confirm it is pullable
        id: confirm
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pi-panel-server-${{ matrix.arch }}
          VERSION: ${{ steps.v.outputs.version }}
        # Home Assistant pulls by exact tag, so check that exact tag resolves
        # rather than trusting the push step's exit code.
        run: docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null

  # Only after every architecture has published. A release is two repositories,
  # and doing them by hand has gone wrong in both directions: the manifest
  # behind the image, a tag pushed against a stale manifest, and the manifest
  # ahead of an image that was never built. Home Assistant reads the version
  # from the add-on repo, so announcing one before its image exists gives
  # "manifest unknown" on every install attempt.
  publish-manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the add-on repository
        env:
          TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "ADDON_REPO_TOKEN is not set, so the add-on repository was not"
            echo "updated. Run addon/sync.sh and push it by hand, or add the"
            echo "secret to automate this — see addon/README.md."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/${OWNER}/pi-panel-addon.git" out
          cp -r addon/repository.yaml addon/panel-server addon/README.md out/
          cd out
          git config user.name  "pi-panel ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Add-on repository already matches $VERSION."
            exit 0
          fi
          git commit -m "Panel Config Server $VERSION"
          git push
          echo "Add-on repository updated to $VERSION."
