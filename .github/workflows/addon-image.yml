name: Add-on image

# Builds the image the Home Assistant add-on pulls. Home Assistant substitutes
# {arch} into the image name, so each architecture is pushed under its own
# name rather than as one multi-arch manifest.
#
# Tag a release to publish: `git tag v0.1.0 && git push --tags`. The tag must
# match the `version` in the add-on's config.yaml, or Home Assistant will try
# to pull an image that does not exist.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish (e.g. 0.1.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the add-on manifest agrees
        run: |
          # A mismatch here is invisible until Home Assistant tries to pull a
          # tag that was never pushed, so fail now rather than then.
          want='${{ steps.v.outputs.version }}'
          have=$(grep -E '^version:' addon/panel-server/config.yaml | cut -d'"' -f2)
          if [ "$want" != "$have" ]; then
            echo "config.yaml says $have, publishing $want — bump one to match." >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pi-panel-server-${{ matrix.arch }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/pi-panel-server-${{ matrix.arch }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
