name: USB installer website
on:
  push:
    branches: [main]
    paths: ['server/app/static/p4-usb*', 'server/app/static/p4-vendor/**', 'tools/build_usb_site.py', '.github/workflows/usb-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: usb-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test USB safeguards
        run: node tests/test_p4_usb.mjs
      - name: Build public files only
        run: python tools/build_usb_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
